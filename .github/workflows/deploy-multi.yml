# Opsora Agent API — production CI/CD
# Source of truth: Vercel/Cloudflare/Supabase. Legacy Render verification is removed.
name: Opsora Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-api:
    name: Verify production API
    runs-on: ubuntu-latest
    steps:
      - name: Check public API health
        run: |
          set -euo pipefail
          API_URL="${OPSORA_API_URL:-https://useopsora.com/api/health}"
          echo "Checking $API_URL"
          for i in $(seq 1 6); do
            CODE=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$API_URL" || true)
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$CODE" = "200" ]; then
              echo "Production API healthy"
              exit 0
            fi
            echo "attempt $i/6: HTTP $CODE"
            sleep 10
          done
          echo "Production API health check failed"
          exit 1
        env:
          OPSORA_API_URL: ${{ vars.OPSORA_API_URL }}

  verify-site:
    name: Verify production site
    runs-on: ubuntu-latest
    steps:
      - name: Check landing page
        run: |
          set -euo pipefail
          CODE=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 20 https://useopsora.com/)
          test "$CODE" = "200"
          grep -q "Opsora" /tmp/site.html
          echo "Production site healthy"

  report:
    name: Production report
    runs-on: ubuntu-latest
    needs: [verify-api, verify-site]
    if: always()
    steps:
      - name: Report
        run: |
          echo "API: ${{ needs.verify-api.result }}"
          echo "Site: ${{ needs.verify-site.result }}"
          if [ "${{ needs.verify-api.result }}" != "success" ] || [ "${{ needs.verify-site.result }}" != "success" ]; then
            exit 1
          fi

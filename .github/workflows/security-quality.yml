name: Security & Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest bandit pip-audit fastapi httpx

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Bandit security scan
        run: bandit -q -r . -x ./.git,./tests -lll

      - name: Dependency audit
        run: pip-audit -r requirements.txt
